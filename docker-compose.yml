services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: project12
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./infra/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro", "./infra/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d project12"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    environment:
      APP_MODE: demo
      REAL_MONEY_ENABLED: "false"
      TOP_UP_ENABLED: "false"
      WITHDRAWAL_ENABLED: "false"
      CASH_REWARD_ENABLED: "false"
      PACKET_PROVIDER: demo
      TNG_INTEGRATION: disabled
      PAYMENT_PROVIDER: disabled
      TELEGRAM_MOCK_ENABLED: "true"
      DATABASE_URL: postgresql://demo:demo@postgres:5432/project12
      REDIS_URL: redis://redis:6379
      API_PORT: 8787
    ports: ["8787:8787"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  miniapp:
    build: { context: ., dockerfile: infra/docker/miniapp.Dockerfile }
    environment: { APP_NAME: Project 12 Demo }
    ports: ["4173:4173"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on: [api]
  admin:
    build: { context: ., dockerfile: infra/docker/admin.Dockerfile }
    environment: { APP_NAME: Project 12 Admin }
    ports: ["4174:4174"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4174').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on: [api]
  worker:
    build: { context: ., dockerfile: infra/docker/worker.Dockerfile }
    environment:
      APP_MODE: demo
      DATABASE_URL: postgresql://demo:demo@postgres:5432/project12
      REDIS_URL: redis://redis:6379
      REAL_MONEY_ENABLED: "false"
      PACKET_PROVIDER: demo
      TNG_INTEGRATION: disabled
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  bot:
    build: { context: ., dockerfile: infra/docker/bot.Dockerfile }
    environment:
      APP_MODE: demo
      BOT_PORT: 8790
      TELEGRAM_MOCK_ENABLED: "true"
      MINIAPP_ORIGIN: http://miniapp:4173
      API_ORIGIN: http://api:8787
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on: [api, miniapp]
volumes:
  pgdata:
